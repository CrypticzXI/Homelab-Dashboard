# Run the image built by GitHub Actions instead of building locally:
#   docker compose -f docker-compose.ghcr.yml up -d
# Set IMAGE to your repository, e.g. ghcr.io/yourname/homelab-dashboard:latest
services:
  dashboard:
    image: ${IMAGE:-ghcr.io/OWNER/REPO:latest}
    container_name: homelab-dashboard
    restart: unless-stopped
    ports:
      - "${DASH_PORT:-8080}:80"
    environment:
      DASH_USER: ${DASH_USER:-admin}
      DASH_PASSWORD: ${DASH_PASSWORD:-change-me}
      SESSION_SECRET: ${SESSION_SECRET:-}
      HOST_ALIAS: ${HOST_ALIAS:-host.docker.internal}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      TZ: ${TZ:-UTC}
      ALLOW_SELF_SIGNED: ${ALLOW_SELF_SIGNED:-true}
    volumes:
      - ./data:/data
      - ${CONTAINER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - /:/host:ro
    security_opt:
      - label=disable
    extra_hosts:
      - "host.docker.internal:host-gateway"
