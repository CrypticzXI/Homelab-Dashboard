[program:api]
command=/usr/local/bin/node /app/api/src/server.js
directory=/app/api
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:tapo]
command=/opt/tapo/bin/python -u /app/tapo-bridge/server.py
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:go2rtc]
# go2rtc persists registered streams (with camera credentials) into its config,
# so it runs against a throwaway copy of the template rather than the image file.
command=/bin/bash -c "mkdir -p /run/go2rtc && cp -f /app/go2rtc.template.yaml /run/go2rtc/go2rtc.yaml && exec /usr/local/bin/go2rtc -config /run/go2rtc/go2rtc.yaml"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
