# Everything runs in one container, so upstreams are loopback.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    client_max_body_size 30m;

    location = /healthz { proxy_pass http://127.0.0.1:3001/healthz; }

    # Backend API (auth, config, widget data, uploads)
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # go2rtc (camera streams) — only for signed-in users; nginx asks the API first
    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:3001/api/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }
    # Only the playback endpoints; the stream list / config would expose camera credentials.
    location ~ ^/go2rtc/api/(stream\.mp4|stream\.m3u8|hls/|frame\.jpeg|stream\.mjpeg|ws|webrtc)$ {
        auth_request /_auth;
        rewrite ^/go2rtc/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:1984;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location /go2rtc/ { return 403; }

    # Hashed build assets can be cached forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
