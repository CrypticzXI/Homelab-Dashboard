name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the web app
        working-directory: web
        run: |
          npm ci || npm install
          npm run build

      - name: Syntax-check the API
        working-directory: api
        run: |
          npm ci --omit=dev || npm install --omit=dev
          for f in $(find src -name '*.js'); do node --check "$f"; done

      - name: Syntax-check the Tapo bridge
        run: python3 -m py_compile tapo-bridge/server.py

      - name: Shellcheck the installer
        run: bash -n install.sh

      - name: Guard against committed secrets
        run: bash .github/scan-secrets.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
