name: Build & publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    # pinned rather than ubuntu-latest so the October 2026 migration to Ubuntu 26
    # can't change the build out from under us
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # lowercased automatically — registries reject capitals in a repo name
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Provenance is nice to have, but the attestation API is occasionally flaky
      # ("Request body length does not match content-length header"). A failure
      # here must not fail a publish that has already succeeded.
      - name: Attest provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "### Published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "digest: \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    # Source tarball attached to tagged releases, for people who'd rather build locally.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create source archive
        run: |
          VERSION=${GITHUB_REF_NAME}
          git archive --format=tar.gz --prefix=homelab-dashboard/ -o homelab-dashboard-${VERSION}.tar.gz HEAD
      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          files: homelab-dashboard-*.tar.gz
          generate_release_notes: true
